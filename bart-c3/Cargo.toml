[package]
name = "bart-c3"
version = "0.1.0"
edition = "2021"

# Standalone crate — not a member of the bart-rs workspace.
[workspace]

[dependencies]
esp-hal = { version = "1.2", features = ["esp32c3", "unstable"] }
esp-backtrace = { version = "0.20", features = [
    "esp32c3",
    "panic-handler",
    "println",
] }
esp-println = { version = "0.18", default-features = false, features = ["esp32c3", "jtag-serial"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32c3"] }
esp-hal-smartled = { version = "0.18", features = ["esp32c3"] }
smart-leds = "0.4"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
